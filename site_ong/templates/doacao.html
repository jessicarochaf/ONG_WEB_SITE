{% extends 'base.html' %}
{% load static %}

{% block conteudo %}

<section class="faixa-azul">
    <h1>FAÇA UMA DOAÇÃO</h1>
    <p>SUA AJUDA FAZ DIFERENÇA!</p>
</section>

<section class="caixas-doacao">
    <!-- caixa do pix -->
    <div class="caixa">
        <img src="{% static 'imagens/pix.png' %}" alt="Pix" class="imagem-pix">
        <img src="{% static 'imagens/pagbank.png' %}" alt="PagBank" class="imagem-pagbank">
        <img src="{% static 'imagens/codigo_qr_pix.png' %}" alt="QR Code do Pix" class="codigo-qr">
    </div>

    <!-- caixa do contato -->
    <div class="caixa">
        <h2 class="contato-titulo">
            <img src="{% static 'imagens/telefone.png' %}" alt=""> CONTATO
        </h2>
        <img src="{% static 'imagens/usuario.png' %}" alt="" class="imagem-usuario">
        <p class="nome-contato">Pr. Vanon Rodrigues</p>
        <p class="legenda">Contato do WhatsApp</p>
        <img src="{% static 'imagens/codigo_qr_whatsapp.png' %}" alt="QR Code do WhatsApp" class="codigo-qr">
    </div>
</section>

<h2 class="titulo-linha frase-final">JUNTOS PODEMOS IR MAIS LONGE</h2>

{% endblock %}
