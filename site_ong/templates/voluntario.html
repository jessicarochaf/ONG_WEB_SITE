
{% extends 'base.html' %}

{% block conteudo %}

<section class="faixa-azul">
    <h1>SEJA VOLUNTÁRIO</h1>
    <p>JUNTOS, PODEMOS FAZER A DIFERENÇA!</p>
</section>

<div class="fundo-voluntario">

    {% if sucesso %}
        <p class="mensagem-sucesso">
            Cadastro enviado com sucesso!
        </p>
    {% endif %}

    {% if erro %}
        <p class="mensagem-erro">{{ erro }}</p>
    {% endif %}

    <form class="formulario" method="POST">
        {% csrf_token %}

        <div class="campo">
            <span class="icone">&#9998;</span>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome completo" required>
        </div>

        <div class="campo">
            <span class="icone">&#9742;</span>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(XX) XXXXX-XXXX" required>
        </div>

        <div class="campo">
            <span class="icone">&#9993;</span>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="seu@email.com" required>
        </div>

        <div class="campo">
            <span class="icone">&#128197;</span>
            <label>Disponibilidade:</label>

            <div class="opcoes-linha">
                <label class="opcao">
                    <input type="radio" name="periodo"
                           value="Manhã" checked>
                    Manhã
                </label>

                <label class="opcao">
                    <input type="radio" name="periodo"
                           value="Tarde">
                    Tarde
                </label>

                <label class="opcao">
                    <input type="radio" name="periodo"
                           value="Noite">
                    Noite
                </label>
            </div>
        </div>

        <div class="campo campo-topo">
            <span class="icone">&#9678;</span>
            <label>Projeto de interesse:</label>

            <div class="caixa-projetos">
                {% for projeto in projetos %}
                    <label class="opcao">
                        <input type="checkbox"
                               name="projetos"
                               value="{{ projeto }}">
                        {{ projeto }}
                    </label>
                {% endfor %}
            </div>
        </div>

        <div class="campo campo-topo">
            <span class="icone">&#9719;</span>
            <label for="horas">Horas por semana:</label>

            <div class="horas">
                <input type="number" id="horas" name="horas"
                       min="0" max="20" value="0" required>

                <input type="range" id="barra_horas"
                       min="0" max="20" value="0">
            </div>
        </div>

        <button type="submit" class="botao-enviar">
            &#10148; Enviar
        </button>
    </form>
</div>

<script>
    const campoHoras = document.getElementById('horas');
    const barraHoras = document.getElementById('barra_horas');

    campoHoras.addEventListener('input', function () {
        let valor = Number(campoHoras.value);

        if (campoHoras.value !== '') {
            valor = Math.max(0, Math.min(20, valor));
            barraHoras.value = valor;
        }
    });

    barraHoras.addEventListener('input', function () {
        campoHoras.value = barraHoras.value;
    });
</script>

{% endblock %}
